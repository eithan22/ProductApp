name: CI

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore ProductApp.sln

      - name: Compilar
        run: dotnet build ProductApp.sln --no-restore --configuration Release

      - name: Ejecutar tests
        run: dotnet test ProductApp.sln --no-build --configuration Release --verbosity normal
