name: CI

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore ProductApp.sln

      - name: Compilar
        run: dotnet build ProductApp.sln --no-restore --configuration Release

      - name: Ejecutar tests
        run: dotnet test ProductApp.sln --no-build --configuration Release --verbosity normal

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar API
        run: dotnet build ProductApp/ProductApp.Api.csproj --configuration Release

      - name: Publicar API
        run: dotnet publish ProductApp/ProductApp.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7263A930E424414B9C1E4CA0A9F727E4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DC98708E8F8C4DC3B304B648F5CE77E5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C34705FB99ED478B9B29E2E85F150B67 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ProductApp-eithan'
          slot-name: 'Production'
          package: ${{env.DOTNET_ROOT}}/myapp

  deploy-web:
    needs: build-and-test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar Web
        run: dotnet build Web/Web.csproj --configuration Release

      - name: Publicar Web
        run: dotnet publish Web/Web.csproj -c Release -o ${{env.DOTNET_ROOT}}/webapp

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ProductApp-eithan-Web'
          slot-name: 'Production'
          package: ${{env.DOTNET_ROOT}}/webapp
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_ABF5F1252B154E62AA2AEAFE009A2A03 }}
